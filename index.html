["köszönhetően","___ seiner Hilfe",["dank"]],
["egy példa alapján","___ dieses Beispiels",["anhand","aufgrund"]],
["eszköz segítségével / révén","___ moderner Technik",["mittels"]],
["alkalmából","___ des Firmenjubiläums",["anlässlich"]],
["tekintettel valamire","___ der schwierigen Lage",["angesichts"]],
["következtében","___ des Stromausfalls",["infolge","wegen","aufgrund"]],
["alapján / miatt","___ der hohen Nachfrage",["aufgrund","wegen","angesichts"]]
];

const EXPLANATIONS=[
[/___ dieses Beispiels$/u,"<b>anhand</b>: egy példa segítségével szemléltetünk vagy magyarázunk. <b>aufgrund</b>: a példa alapján következtetünk vagy indokolunk. A rövid kifejezésben mindkettő helyes."],
[/___ des Stromausfalls/u,"<b>infolge</b>: következtében (az eredményt hangsúlyozza). <b>wegen</b>: miatt. <b>aufgrund</b>: miatt, formálisabb."],
[/___ des schlechten Wetters/u,"<b>wegen</b>: miatt. <b>aufgrund</b>: miatt, formálisabb. <b>infolge</b>: következtében."],
[/___ der hohen Nachfrage/u,"<b>wegen / aufgrund</b>: a nagy kereslet miatt. <b>angesichts</b>: a nagy keresletre tekintettel."],
[/___ der Ferien/u,"<b>während</b>: a szünet alatt (idő). <b>wegen</b>: a szünet miatt (ok)."],
[/___ seines Trainings/u,"<b>dank</b>: az edzésének köszönhetően (kedvező ok). <b>wegen / aufgrund</b>: az edzése miatt."],
[/___ der letzten zehn Jahre/u,"<b>innerhalb</b>: tíz éven belül. <b>während</b>: az elmúlt tíz év során."],
[/___ der Krise/u,"<b>während</b>: a válság idején. <b>wegen / aufgrund</b>: a válság miatt. <b>infolge</b>: a válság következtében."],
];
function explanationFor(sentence,answers){
 const special=EXPLANATIONS.find(([re])=>re.test(sentence));
 if(special&&answers.length>1)return special[1];
 if(answers.length>1){const terms=new Set(answers.map(a=>a.toLocaleLowerCase("de")));
  if(terms.has("statt")&&terms.has("anstatt"))return "<b>statt / anstatt</b>: „helyett”; mindkettő helyes.";
  if(terms.has("wegen")&&terms.has("aufgrund"))return "<b>wegen</b>: „miatt”; <b>aufgrund</b>: „miatt”, gyakran formálisabb. Az egyéb megadott válaszok a mondat értelmétől függően helyesek.";
 }
 return "";
}
function solutionHtml(sentence,answers){const note=explanationFor(sentence,answers);
 return `<div class="solutions"><b>${answers.length>1?"Akzeptierte Lösungen:":"Lösung:"}</b> ${answers.map(esc).join(" / ")}</div>${note?`<div class="nuance"><b>Bedeutungsunterschied (HU):</b> ${note}</div>`:""}`;
}
const app=document.getElementById("app");let screen="home",setIndex=-1,question=0,score=0,secondScore=0,tries=0,finished=false,entry="",checked=false,earned=false,results=[],revealed=false;
const homeSvg='<span aria-hidden="true">⌂</span>';
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function nav(s){screen=s;render();window.scrollTo({top:0,behavior:"instant"})}
document.getElementById("home").addEventListener("click",()=>nav("home"));
const STORE_KEY="genitiv_grundlagen_progress_v1";
function readProgress(){try{const x=JSON.parse(localStorage.getItem(STORE_KEY)||"{}");return x&&typeof x==="object"?x:{}}catch(e){return {}}}
let progress=readProgress();
function saveProgress(){try{localStorage.setItem(STORE_KEY,JSON.stringify(progress))}catch(e){}}
function taskKey(){return screen==="vocab"?"v"+vocabSet:"e"+setIndex}
function markProgress(done=false){
 const k=taskKey(),total=screen==="vocab"?7:groups[setIndex].items.length;
 const prev=progress[k]||{};
 progress[k]={completed:!!(done||prev.completed),current:done?total:question,first:score,second:secondScore,checked,tries,revealed,total,updated:Date.now()};
 saveProgress();
}
function statusHTML(key,total){
 const r=progress[key];if(!r)return '<span class="status-label open">Noch offen</span>';
 if(r.completed)return `<span class="status-label done">✓ Abgeschlossen</span><span class="status-score">${Math.min(r.first||0,total)}/${total} beim 1. Versuch</span>`;
 return `<span class="status-label working">◔ In Arbeit · ${Math.min(r.current||0,total)}/${total}</span><span class="mini-progress"><span style="width:${Math.min(100,100*(r.current||0)/total)}%"></span></span>`;
}
function resumeProgress(key){
 const r=progress[key];if(!r||r.completed)return false;
 const total=key.startsWith("v")?7:groups[Number(key.slice(1))].items.length;
 question=Math.max(0,Math.min(total-1,(Number(r.current)||0)+(r.checked?1:0)));score=Number(r.first)||0;secondScore=Number(r.second)||0;checked=false;tries=0;revealed=false;
 return true;
}
function home(){app.innerHTML=`<section class="hero"><h1>Präpositionen mit Genitiv – Grundlagentraining</h1><p class="sub">Bedeutungen lernen · Präpositionen üben · sicher anwenden</p></section><div class="grid">
<button class="tile" data-nav="grammar"><span class="symbol" style="color:#60e8d9">▦</span><b>Grammatik</b><small>Kasus · Genitivformen</small></button>
<button class="tile" data-nav="preps"><span class="symbol" style="color:#bca9ff">▤</span><b>Präpositionen</b><small>Bedeutung · Beispiele · Übersetzung</small></button>
<button class="tile" data-vocab="0"><span class="symbol" style="color:#7ce6a8">01</span><b>Wortschatz 1</b><small>Häufige Präpositionen</small>${statusHTML("v0",7)}</button><button class="tile" data-vocab="1"><span class="symbol" style="color:#d6a7ff">02</span><b>Wortschatz 2</b><small>Weitere Präpositionen</small>${statusHTML("v1",7)}</button>${groups.map((g,i)=>`<button class="tile" data-set="${i}"><span class="symbol" style="color:${i<3?'#76cfff':i<5?'#ffc67c':'#ff9db5'}">${i===8?'★':String(i+1).padStart(2,'0')}</span><b>${esc(g.title)}</b><small>${esc(g.level)} · ${g.items.length} Sätze</small>${statusHTML("e"+i,g.items.length)}</button>`).join("")}</div><p class="intro">Jede Übung ist unabhängig. Eine richtige Präposition genügt. Wenn du mehrere eingibst, müssen alle richtig sein.</p>`;wire()}
function grammar(){app.innerHTML=`<section class="panel"><h1>Grammatik</h1><p class="sub">Die vier Fälle – bestimmte Artikel</p><h3>Kasustabelle</h3><div class="tablewrap"><table><thead><tr><th>Kasus</th><th>Maskulin</th><th>Feminin</th><th>Neutrum</th><th>Plural</th></tr></thead><tbody><tr><td>Nominativ</td><td>der</td><td>die</td><td>das</td><td>die</td></tr><tr><td>Akkusativ</td><td>den</td><td>die</td><td>das</td><td>die</td></tr><tr><td>Dativ</td><td>dem</td><td>der</td><td>dem</td><td>den</td></tr><tr class="gen"><td>Genitiv</td><td>des</td><td>der</td><td>des</td><td>der</td></tr></tbody></table></div>
<h3>Beispiele</h3><div class="tablewrap"><table><thead><tr><th>Genitiv</th><th>Beispielsatz</th></tr></thead><tbody>
<tr><td>des Mannes</td><td>Wegen <b>des Mannes</b> kamen wir zu spät.<span class="translation">A férfi miatt elkéstünk.</span></td></tr>
<tr><td>der Frau</td><td>Wegen <b>der Frau</b> haben wir gewartet.<span class="translation">A nő miatt vártunk.</span></td></tr>
<tr><td>des Kindes</td><td>Wegen <b>des Kindes</b> bleiben wir zu Hause.<span class="translation">A gyermek miatt otthon maradunk.</span></td></tr>
<tr><td>der Kinder</td><td>Trotz <b>der Kinder</b> blieb sie konzentriert.<span class="translation">A gyerekek ellenére is összpontosítani tudott.</span></td></tr>
</tbody></table></div><div class="note"><b>Magyarázat:</b> Hím- és semleges nemben a főnév egyes számban rendszerint <b>-s</b> vagy <b>-es</b> végződést kap: des Tag<b>es</b>, des Auto<b>s</b>. Nőnemben és többes számban nincs ilyen főnévi végződés.</div><div class="note"><b>Fontos:</b> A <i>dank</i>, <i>wegen</i> és <i>laut</i> bizonyos használatokban Dativval is előfordulhat. A <i>laut dem Bericht</i> szerkezetben Dativ áll. A feladatokban a prepozíciókat gyakoroljuk.</div><div class="actions"><button class="primary" data-nav="preps">Präpositionen ansehen →</button></div></section>`;wire()}
let filter="alle";
function preps(){let cats=["alle","kausal","konsekutiv","konzessiv","modal","temporal","lokal","situativ","Anlass"];let shown=P.filter(p=>filter==="alle"||p[2].split(" / ").includes(filter));app.innerHTML=`<section class="panel"><h1>Präpositionen</h1><p class="sub">Bedeutung · Beispielsatz · Übersetzung · Erklärung</p><h3>Alle Präpositionen</h3><div class="filter">${cats.map(c=>`<button data-filter="${c}" class="${filter===c?'active':''}">${c==="alle"?"Alle":c}</button>`).join("")}</div><div class="tablewrap"><table><thead><tr><th>Präposition</th><th>Magyar jelentés</th><th>Beispiel · Übersetzung · Erklärung</th></tr></thead><tbody>${shown.map(p=>`<tr><td><b class="tag">${esc(p[0])}</b><span class="translation">${esc(p[2])}</span></td><td>${esc(p[1])}</td><td>${esc(p[3])}<span class="translation">${esc(p[4])}</span><span class="translation"><b>Magyarázat:</b> ${esc(p[5])}</span></td></tr>`).join("")}</tbody></table></div><h3>Funktionen im Überblick</h3><div class="tablewrap"><table><thead><tr><th>Funktion</th><th>Mit jelent?</th><th>Präpositionen</th></tr></thead><tbody><tr><td>kausal</td><td>ok, indok</td><td>wegen, aufgrund, dank</td></tr><tr><td>situativ</td><td>helyzetre tekintettel</td><td>angesichts</td></tr><tr><td>Anlass</td><td>alkalom</td><td>anlässlich</td></tr><tr><td>konsekutiv</td><td>következmény</td><td>infolge</td></tr><tr><td>konzessiv</td><td>ellentét, megengedés</td><td>trotz</td></tr><tr><td>modal</td><td>mód, eszköz, forrás</td><td>mittels, anhand, statt / anstatt, laut</td></tr><tr><td>temporal</td><td>időviszony</td><td>während, innerhalb, außerhalb</td></tr><tr><td>lokal</td><td>helyviszony</td><td>innerhalb, außerhalb</td></tr></tbody></table></div><div class="note">Egy prepozíció több funkciót is betölthet. A táblázat a tanulást segítő, egyszerűsített rendszerezés.</div></section>`;app.querySelectorAll("[data-filter]").forEach(b=>b.onclick=()=>{filter=b.dataset.filter;preps()})}
function start(i){if(progress["e"+i]?.completed){delete progress["e"+i];saveProgress()}setIndex=i;question=0;score=0;secondScore=0;tries=0;finished=false;entry="";checked=false;earned=false;revealed=false;results=[];screen="exercise";resumeProgress("e"+i);markProgress();render()}
function splitAnswers(v){const s=v.trim().normalize("NFC");if(!s)return[];return s.split(/[\s,;/]+/u).filter(Boolean)}
function sameWord(a,b){return a.toLocaleLowerCase("de")===b.toLocaleLowerCase("de")||(a===a.toLocaleUpperCase("de")&&a===b.toLocaleUpperCase("de"))}
function evaluate(){const item=groups[setIndex].items[question],accepted=item[2];const answers=splitAnswers(entry);return answers.length>0&&answers.every(a=>accepted.some(valid=>sameWord(a,valid)))}
function exercise(){const g=groups[setIndex];if(finished){app.innerHTML=`<section class="panel"><span class="chip">${esc(g.level)}</span><h1>Ergebnis</h1><p class="sub">${esc(g.title)}</p><div class="bigscore">${score} / ${g.items.length}</div><p>Beim ersten Versuch richtig: <b>${score} / ${g.items.length}</b></p><p>Nach zwei Versuchen richtig: <b>${secondScore} / ${g.items.length}</b></p><h3>Lösungen</h3><ol class="answerlist">${g.items.map((item,i)=>`<li><b>${esc(item[0].replace("___", "_____"))}</b><br><span class="translation">${solutionHtml(item[0],item[2])}</span></li>`).join("")}</ol><div class="actions"><button class="primary" id="restart">Noch einmal</button><button class="secondary" data-nav="home">Zur Startseite</button></div></section>`;document.getElementById("restart").onclick=()=>start(setIndex);wire();return}
const item=g.items[question];const hintHu=(g.level==="Finale"?"":hintFor(item,setIndex,question));const guided=setIndex===0;app.innerHTML=`<section class="panel"><div class="count"><span>${esc(g.level)} · ${esc(g.title)}</span><span>${question+1} / ${g.items.length}</span></div><div class="progress"><div class="bar" style="width:${question/g.items.length*100}%"></div></div><h2 style="margin-top:22px">${esc(g.hint)}</h2>${item[1]?`<div class="context"><b>Vorgabe:</b> ${esc(item[1])}</div>`:""}<div class="prompt">${esc(item[0]).replace("___",'<span style="color:#6cebdc;font-weight:800">________</span>')}</div>${guided&&hintHu?`<p class="muted"><b>Magyarul:</b> (${esc(hintHu)})</p>`:""}<label class="sr" for="answer">Deine Antwort</label><input id="answer" class="field" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Deine Antwort …" value="${esc(entry)}" ${checked?'disabled':''}><p class="muted">Eine richtige Lösung genügt. Mehrere richtige Präpositionen sind möglich (Komma, / oder Leerzeichen). </p><div class="actions"><button id="check" class="primary">${checked?"Weiter →":"Überprüfen"}</button><button id="reset" class="secondary">Zurücksetzen</button><button id="reveal" class="secondary">Lösungen anzeigen</button>${!guided&&hintHu?`<button id="tip" class="secondary">Tipp anzeigen</button>`:""}</div><div id="tipbox"></div><div id="fb"></div></section>`;
document.getElementById("reset").onclick=()=>{entry="";if(checked){tries=Math.max(tries,2);revealed=true;}checked=false;exercise()};
const tipButton=document.getElementById("tip");if(tipButton)tipButton.onclick=()=>{document.getElementById("tipbox").innerHTML=`<div class="note"><b>Magyar segítség:</b> ${esc(hintHu)}</div>`;tipButton.disabled=true;tipButton.textContent="Tipp angezeigt"};
document.getElementById("reveal").onclick=()=>{if(!checked){revealed=true;checked=true;markProgress();}showFeedback(false,true)};
const input=document.getElementById("answer");
input.oninput=e=>entry=e.target.value;
input.onkeydown=e=>{if(e.key==="Enter")document.getElementById("check").click()};
document.getElementById("check").onclick=()=>{
 if(checked){advance();return}
 if(!entry.trim())return;
 const ok=evaluate();tries++;
 if(ok){if(tries===1&&!revealed)score++;if(tries<=2&&!revealed)secondScore++;checked=true;markProgress();showFeedback(true,false)}
 else if(tries===1){const fb=document.getElementById("fb");fb.className="feedback bad";fb.innerHTML="<b>Noch nicht richtig. Versuch es noch einmal!</b>";input.value="";entry="";input.focus()}
 else {checked=true;markProgress();showFeedback(false,false)}
};
}
function showFeedback(ok,skip){
 const item=groups[setIndex].items[question],fb=document.getElementById("fb");
 fb.className="feedback "+(ok?"ok":skip?"info":"bad");
 fb.innerHTML=`<b>${ok?(tries===1?"✓ Richtig! Sehr gut!":"✓ Richtig! Gut gemacht!"):skip?"Lösungen":"✕ Noch nicht richtig."}</b>${solutionHtml(item[0],item[2])}`;
 document.getElementById("check").textContent="Weiter →";
 document.getElementById("answer").value=entry;document.getElementById("answer").disabled=true;
}
function advance(){question++;entry="";tries=0;checked=false;earned=false;revealed=false;if(question>=groups[setIndex].items.length)finished=true;markProgress(finished);render()}
function wire(){app.querySelectorAll("[data-nav]").forEach(b=>b.onclick=()=>nav(b.dataset.nav));app.querySelectorAll("[data-set]").forEach(b=>b.onclick=()=>start(Number(b.dataset.set)));app.querySelectorAll("[data-vocab]").forEach(b=>b.onclick=()=>startVocab(Number(b.dataset.vocab)))}
let vocabSet=0;
function startVocab(n){if(progress["v"+n]?.completed){delete progress["v"+n];saveProgress()}vocabSet=n;setIndex=-1;question=0;score=0;secondScore=0;tries=0;entry="";checked=false;finished=false;revealed=false;screen="vocab";results=[];resumeProgress("v"+n);markProgress();render()}
function vocabView(){
 const selected=vocabSet===0?vocab.slice(0,7):vocab.slice(7);
 if(finished){app.innerHTML=`<section class="panel"><h1>Ergebnis</h1><div class="bigscore">${score} / ${selected.length}</div><p>Beim ersten Versuch richtig: <b>${score} / ${selected.length}</b></p><p>Nach zwei Versuchen richtig: <b>${secondScore} / ${selected.length}</b></p><h3>Lösungen und Bedeutungsunterschiede</h3><ol class="answerlist">${selected.map(item=>`<li>${esc(item[0])} – ${esc(item[1])}${solutionHtml(item[1],item[2])}</li>`).join("")}</ol><div class="actions"><button class="primary" id="again">Noch einmal</button><button class="secondary" data-nav="home">Zur Startseite</button></div></section>`;document.getElementById("again").onclick=()=>startVocab(vocabSet);wire();return}
 const item=selected[question],answers=item[2];
 app.innerHTML=`<section class="panel"><div class="count"><span>Wortschatztraining ${vocabSet+1}</span><span>${question+1} / ${selected.length}</span></div><div class="progress"><div class="bar" style="width:${question/selected.length*100}%"></div></div><h2>Wie heißt die Präposition auf Deutsch?</h2><div class="context"><b>${esc(item[0])}</b><p>${esc(item[1])}</p></div><label class="sr" for="answer">Deine Antwort</label><input class="field" id="answer" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Präposition …" value="${esc(entry)}" ${checked?'disabled':''}><p class="muted">Eine richtige Lösung genügt. Mehrere richtige Lösungen sind möglich.</p><div class="actions"><button class="primary" id="check">${checked?"Weiter →":"Überprüfen"}</button><button class="secondary" id="reset">Zurücksetzen</button><button class="secondary" id="reveal">Lösungen anzeigen</button></div><div id="fb"></div></section>`;
 document.getElementById("answer").oninput=e=>entry=e.target.value;
 document.getElementById("answer").onkeydown=e=>{if(e.key==="Enter")document.getElementById("check").click()};
 document.getElementById("reset").onclick=()=>{entry="";if(checked){tries=Math.max(tries,2);revealed=true;}checked=false;vocabView()};
 const feedback=(ok,show)=>{const fb=document.getElementById("fb");fb.className="feedback "+(ok?"ok":show?"info":"bad");fb.innerHTML=`<b>${ok?"✓ Richtig!":show?"Lösungen":"✕ Noch nicht richtig."}</b>${solutionHtml(item[1],answers)}`;document.getElementById("answer").value=entry;document.getElementById("answer").disabled=true;document.getElementById("check").textContent="Weiter →"};
 document.getElementById("reveal").onclick=()=>{if(!checked){revealed=true;checked=true;markProgress();}feedback(false,true)};
 document.getElementById("check").onclick=()=>{
  if(checked){question++;entry="";checked=false;tries=0;revealed=false;if(question>=selected.length)finished=true;markProgress(finished);vocabView();return}
  if(!entry.trim())return;
  const entered=splitAnswers(entry);
  const ok=entered.length>0&&entered.every(x=>answers.some(valid=>sameWord(x,valid)));
  tries++;
  if(ok){if(tries===1&&!revealed)score++;if(tries<=2&&!revealed)secondScore++;checked=true;markProgress();feedback(true,false)}
  else if(tries===1){const fb=document.getElementById("fb");fb.className="feedback bad";fb.innerHTML="<b>Noch nicht richtig. Versuch es noch einmal!</b>";entry="";document.getElementById("answer").value="";document.getElementById("answer").focus()}
  else {checked=true;markProgress();feedback(false,false)}
 };

}
function render(){if(screen==="vocab"){vocabView();return}if(screen==="home")home();else if(screen==="grammar")grammar();else if(screen==="preps")preps();else exercise()}
render();
</script></body></html>
